[package]
name = "rusd-viewer"
description = "Rusd remote viewer client (D12): memory composite, persistent-device viewport, egui shell, wire protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "rusd-viewer"
path = "src/main.rs"

[dependencies]
rusd-core.workspace = true
rusd-scene.workspace = true
rusd-render.workspace = true
openusd.workspace = true
serde_json = "1"
bytemuck = { version = "1.25.2", features = ["derive"] }
# Encoding a capture's image and mask in memory (`crate::capture`); the same
# crate `rusd-render` writes PNGs with, so one version of the encoder.
png = "0.18.1"
wgpu = "30.0.2"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", features = ["winit"] }
egui-winit = { version = "0.37", default-features = false, features = ["wayland", "x11"] }
winit = "0.30"
pollster = "1.0.1"

[dev-dependencies]
rusd-proc.workspace = true
rusd-usd.workspace = true
# The real `rusd serve` in-process, so `tests/served_startup.rs` checks startup
# against the server that actually ships rather than against a mock of it.
rusd-agent.workspace = true
