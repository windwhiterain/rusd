[package]
name = "rusd-viewer"
description = "Rusd remote viewer client (D12): memory composite, persistent-device viewport, egui shell, wire protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "rusd-viewer"
path = "src/main.rs"

[dependencies]
rusd-core.workspace = true
rusd-scene.workspace = true
rusd-render.workspace = true
openusd.workspace = true
serde_json = "1"
bytemuck = { version = "1.25.2", features = ["derive"] }
# Encoding a capture's image and mask in memory (`crate::capture`); the same
# crate `rusd-render` writes PNGs with, so one version of the encoder.
png = "0.18.1"
wgpu = "30.0.2"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", features = ["winit"] }
egui-winit = { version = "0.37", default-features = false, features = ["wayland", "x11"] }
winit = "0.30"
pollster = "1.0.1"

# The OS's own view of the window (`crate::platform_metrics`): `GetClientRect`,
# `GetWindowRect`, `GetDpiForWindow` and the thread's DPI awareness. The point of the
# module is a **second opinion** on the same window, so the probe must not travel
# through winit — which is why these are called directly here.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
# `Window::window_handle()`: the HWND the probe reads. Already in the lock (winit and
# wgpu both take it), so this adds no crate to the build.
raw-window-handle = "0.6"

[dev-dependencies]
rusd-proc.workspace = true
rusd-usd.workspace = true
# The real `rusd serve` in-process, so `tests/served_startup.rs` checks startup
# against the server that actually ships rather than against a mock of it.
rusd-agent.workspace = true
