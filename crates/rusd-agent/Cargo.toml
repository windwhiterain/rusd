[package]
name = "rusd-agent"
description = "Rusd agent protocol: stateful session + stdio/TCP JSON-RPC tool server (SPEC §8, D10/D11/D12)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rusd-core.workspace = true
rusd-scene.workspace = true
rusd-proc.workspace = true
rusd-render.workspace = true
openusd.workspace = true
rusd-usd.workspace = true
serde_json = "1"
toml_edit = "0.25"
# Server-side file watch for hot reload (PROTOCOL §规则). The openusd crate's
# absent reload (REMOTE §9 G3/G4) is a client-mirror gap; watching the document
# file is this crate's job.
notify = "8"

[dev-dependencies]
# The integration test composes a snapshot the way a viewer does (Tier A).
rusd-scene.workspace = true