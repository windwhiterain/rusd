[package]
name = "rusd-cli"
description = "The rusd command line: fmt, parse, validate, expand, render, serve, export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "rusd"
path = "src/main.rs"

[dependencies]
rusd-core.workspace = true
rusd-scene.workspace = true
rusd-proc.workspace = true
rusd-render.workspace = true
rusd-agent.workspace = true
rusd-usd.workspace = true
[dev-dependencies]
# The `serve --listen` smoke drives the binary and speaks JSON-RPC over TCP.
serde_json = "1"
