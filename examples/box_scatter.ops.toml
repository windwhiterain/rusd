# rusd 0.1 — **文档就是这张算子图**
#
# 词汇是本工具自己的：`operator` / `output` / `input`。没有 USD 词，也没有 `stage`：
# 这里只有一个一个的算子。**每个算子一个 USD 输入、一个 USD 输出**。

[operator.Samples]
operator    = "sample_points"
description = "在 Volume 盒内均匀采 60 个点（第一阶段）"
output      = "samples.rusd:/World/Samples"
input       = "volume.rusd:/World/Volume"
count = 60
seed  = 11

[operator.Boxes]
operator    = "instances"
description = "每个点放一个 box，得到一簇 box（原型来自素材层）"
output      = "boxes.rusd:/World/Boxes"
input       = "box.rusd:/World/Prototypes/Box"
max_prims = 5000
seed      = 11

[operator.SurfaceSamples]
operator    = "sample_points"
description = "在 Terrain 表面面积加权采 40 个点（第二阶段）"
output      = "surface_samples.rusd:/World/SurfaceSamples"
input       = "terrain.rusd:/World/Terrain"
count = 40
seed  = 7

[operator.Instances]
operator    = "instances"
description = "把第一阶段的一簇 box 实例化到 quad 表面"
output      = "instances.rusd:/World/Instances"
input       = "/World/Boxes"
max_prims = 5000
seed      = 7
