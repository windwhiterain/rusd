# rusd 0.1 — **文档就是这张算子图**：第一段（Cube 体积 → 采样 → 一簇 box）
#
# 词汇是本工具自己的：`operator` / `outputs` / `input`；USD 层是**输入**（`input = "…rusd:/World/…"`），
# 产物写成 `.rusd`。**每个算子一个 USD 输入、一个 USD 输出**——输入不是表。

[stage]
default_prim = "/World"
meters_per_unit = 1.0
seed = 20261118
up_axis = "Z"


[operator.Samples]
operator    = "sample_points"
description = "在 Volume 盒内均匀采 60 个点（第一阶段）"
output      = "samples.rusd:/World/Samples"
input       = "volume.rusd:/World/Volume"
count = 60
seed  = 11

[operator.Boxes]
operator    = "instances"
description = "每个点放一个 box，得到一簇 box（原型来自素材层）"
output      = "boxes.rusd:/World/Boxes"
input       = "box.rusd:/World/Prototypes/Box"
max_prims = 5000
seed      = 11
