# rusd 0.1 — D14 A 演示：几何进，几何出（点 → 实例）
#
# 输入是 `points_scatter.rusd` 里那片点。RusdScatter 用 `input_points` 读这些点
# （含世界变换），在自己的输出层写原型实例，并对输入写一条 visibility=invisible 的
# over —— 不改、不删那份 spec，所以停下在 scatter 之前的前缀仍见点。
#
# 两个槽各写一行：`input` 是原型（被实例化的是它），`input_points` 是点。

[stage]
default_prim = "/World"
seed = 20261118

[operator.Spots]
operator     = "scatter"
description  = "每点一个树实例（几何进，几何出）"
output       = "spots.rusd:/World/Spots"
input        = "points_scatter.rusd:/World/Prototypes/Pine"
input_points = "points_scatter.rusd:/World/Dots"
max_prims = 2000
seed      = 5
