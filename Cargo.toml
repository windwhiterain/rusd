[workspace]
resolver = "3"
members = [
    "crates/rusd-core",
    "crates/rusd-scene",
    "crates/rusd-proc",
    "crates/rusd-render",
    "crates/rusd-agent",
    "crates/rusd-usd",
    "crates/rusd-cli",
    "crates/rusd-viewer",
    "crates/spike-openusd",
]
# Routine builds/tests skip the openusd spike (heavy dep); run it with -p spike-openusd.
default-members = [
    "crates/rusd-core",
    "crates/rusd-scene",
    "crates/rusd-proc",
    "crates/rusd-render",
    "crates/rusd-agent",
    "crates/rusd-usd",
    "crates/rusd-cli",
    "crates/rusd-viewer",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
authors = ["Rusd contributors"]

[workspace.dependencies]
rusd-core = { path = "crates/rusd-core" }
rusd-scene = { path = "crates/rusd-scene" }
rusd-proc = { path = "crates/rusd-proc" }
rusd-render = { path = "crates/rusd-render" }
rusd-agent = { path = "crates/rusd-agent" }
rusd-usd = { path = "crates/rusd-usd" }
# Scene/composition/interop backend (SPEC D3). Pinned; upgrades go through the spike.
openusd = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1